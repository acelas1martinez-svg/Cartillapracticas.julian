<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartilla Olímpica · Negro y Rojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--g1:#161616;--g2:#242424;--g3:#3a3a3a;--tx:#ececec;--mu:#a3a3a3;--red:#e50914;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Barlow,system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.d{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;margin:0}
nav{width:250px;flex:none;background:var(--g1);border-right:3px solid var(--red);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{text-align:center;margin-bottom:14px}
nav h1{font-size:22px;margin-top:6px}nav small{color:var(--mu)}
.bar{height:6px;background:var(--g3);border-radius:4px;margin:12px 4px}.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:4px;transition:width .4s}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;color:var(--red);min-width:30px}
nav button.on{background:var(--g3)}nav button:hover{background:var(--g2)}
nav button.ok::after{content:"✓";margin-left:auto;color:var(--red)}
nav hr{border:0;border-top:1px solid var(--g3);margin:8px 0}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,48px) 60px;max-width:980px}
.top{background:linear-gradient(135deg,var(--g2),var(--g1));border-left:8px solid var(--red);border-radius:6px;padding:18px 22px;margin-bottom:18px}
.top .d{color:var(--red);font-size:15px}
.top h2{font-size:clamp(30px,6vw,52px);margin:4px 0 8px}
.top em{color:var(--mu);font-style:normal}
.q{background:var(--red);color:#fff;border-radius:6px;padding:16px 20px;margin-bottom:18px}
.q .d{font-size:13px;opacity:.85}.q p{font:400 clamp(20px,3.5vw,30px)/1.15 Anton,Impact,sans-serif;margin:4px 0 0;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--g1);border:1px solid var(--g3);border-top:4px solid var(--red);border-radius:6px;padding:14px 16px}
.card h3{font-size:19px;color:var(--red);margin-bottom:6px}.card.w{grid-column:1/-1}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:400 17px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:var(--g3)}.btn:disabled{opacity:.4}
.pn{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--g2);color:var(--tx);border:1px solid var(--g3);border-radius:6px;padding:10px 14px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--red)}.opt.good{border-color:#fff;background:#3b0a0d}.opt.bad{opacity:.5}
.fb{color:var(--mu);margin:6px 0 0;min-height:1.4em}
textarea{width:100%;min-height:130px;background:var(--g2);color:var(--tx);border:1px solid var(--g3);border-radius:6px;padding:12px;font:inherit}
textarea:focus,button:focus-visible{outline:2px solid var(--red)}
footer{margin-top:40px;color:var(--mu);font-size:14px;border-top:1px solid var(--g3);padding-top:12px}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:3px solid var(--red);padding-top:calc(8px + env(safe-area-inset-top,0px))}nav .brand,nav .bar,nav hr,nav small{display:none}nav button{width:auto;white-space:nowrap;padding:6px 10px;flex:none}nav button span{display:none}nav button.ok::after{content:""}}
.sc{border-top:1px dashed var(--g3);padding-top:10px;margin-top:10px}.chip{display:inline-block;background:var(--g3);border-radius:20px;padding:6px 12px;margin:4px;cursor:grab}.chip.on{outline:2px solid var(--red)}.chip.ok{background:#3b0a0d;border:1px solid var(--red);cursor:default}.bx{border:2px dashed var(--red);border-radius:8px;padding:8px;min-height:70px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:var(--red);font:400 15px Anton,Impact,sans-serif;letter-spacing:.04em;text-align:left;text-transform:uppercase}th,td{padding:8px;border:1px solid var(--g3);vertical-align:top;font-size:14px}.opt.sm{display:inline-block;width:auto;padding:6px 14px;margin:2px}.opt.sel{background:var(--red);border-color:var(--red);color:#fff}
.top{position:relative;overflow:hidden}.top .ico{position:absolute;right:12px;top:10px;opacity:.22}.top .ico svg{display:block}.au{color:var(--red);font:400 15px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;margin-top:6px}.au2{display:inline-block;margin-top:10px;border-top:1px solid var(--g3);padding-top:8px;font:400 15px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}.meds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}.meds span{opacity:.25;transition:.3s}.meds span.on{opacity:1;filter:drop-shadow(0 0 5px #e50914)}.pn{flex-wrap:wrap}.card{transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:var(--red)}main>*{animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}.cf{position:fixed;top:40vh;width:8px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cf 1.4s ease-out forwards}@keyframes cf{to{transform:translate(var(--dx),55vh) rotate(540deg);opacity:0}}@media(max-width:760px){.meds{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mute{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid var(--red);background:var(--g1);color:#fff;font-size:20px;cursor:pointer}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 18px;border-radius:30px;font:400 16px Anton,Impact,sans-serif;z-index:90;animation:up .3s both}#fn{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#4a0508,#0b0b0b 70%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;animation:fi .6s both}#fn::before{content:"";position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(229,9,20,.14) 0 8deg,transparent 8deg 16deg);animation:sp 40s linear infinite}@keyframes fi{from{opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}#fn .in{position:relative;z-index:2;max-width:640px;max-height:100%;overflow-y:auto}#fn h2{font-size:clamp(44px,11vw,96px);color:#fff;text-shadow:0 0 24px #e50914;animation:pu 1.6s infinite alternate}@keyframes pu{to{text-shadow:0 0 50px #e50914,0 0 8px #e50914;transform:scale(1.04)}}#fn p{font-size:18px;color:#ddd}#fn p.au{color:var(--red)}.mr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}.rg{width:200px;display:block;margin:8px auto}.rc{fill:none;stroke-width:4;stroke-dasharray:90;animation:dr 1s both}@keyframes dr{from{stroke-dashoffset:90}}.fl{display:inline-block;animation:fl 1s infinite alternate}@keyframes fl{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.14) rotate(3deg)}}.rn{position:absolute;top:-20px;width:9px;height:16px;border-radius:2px;animation:rn linear infinite}@keyframes rn{to{transform:translateY(115vh) rotate(720deg)}}
.in{width:100%;background:var(--g2);color:var(--tx);border:1px solid var(--g3);border-radius:6px;padding:10px;margin:4px 0;font:inherit}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sv=(k,v)=>{try{localStorage.setItem("cr_"+k,v)}catch(e){}};
const ld=k=>{try{return localStorage.getItem("cr_"+k)||""}catch(e){return ""}};
const ta=(k,ph)=>'<textarea data-k="'+k+'" placeholder="'+ph+'">'+esc(ld(k))+'</textarea>';
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.k)sv(e.target.dataset.k,e.target.value)});
const VID=["https://youtu.be/E6iD7zA21g8","https://youtu.be/Nzk7NHMZH2A"];
const vb=(i,l)=>'<a class="btn" href="'+VID[i]+'" target="_blank" rel="noopener">▶ '+l+'</a>';
const tb=(h,r)=>'<div class="wrap"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join("")+'</tr>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</table></div>';
const SC={};
function scen(id,t,s,o){SC[id]=o;return '<div class="sc"><b>'+t+'</b><p>'+s+'</p>'+o.map((x,j)=>'<button class="opt" id="'+id+j+'" onclick="pick(\''+id+'\','+j+')">'+x[0]+'</button>').join("")+'<p class="fb" id="'+id+'f"></p></div>'}
function pick(id,j){SC[id].forEach((x,k)=>{const b=$(id+k);b.className="opt "+(x[1]?"good":"bad");b.disabled=true});$(id+"f").textContent=SC[id][j][2];snd(SC[id][j][1]?"ok":"bad")}
let R={};const SK=["Liderazgo","Comunicación","Trabajo en equipo","Inteligencia emocional","Resolución de problemas"];
function rates(g,items){return '<p class="fb">1 = casi nunca · 4 = siempre</p>'+items.map((t,i)=>'<div><p>'+t+'</p>'+[1,2,3,4].map(v=>'<button class="opt sm" data-g="'+g+'" data-i="'+i+'" onclick="rate(\''+g+'\','+i+','+v+','+items.length+')">'+v+'</button>').join("")+'</div>').join("")+'<div class="q" style="margin-top:12px;display:none" id="'+g+'r"></div>'}
function rate(g,i,v,n){R[g]=R[g]||{};R[g][i]=v;document.querySelectorAll('[data-g="'+g+'"][data-i="'+i+'"]').forEach((b,k)=>b.classList.toggle("sel",k+1==v));if(Object.keys(R[g]).length==n){const o=Object.values(R[g]),a=o.reduce((x,y)=>x+y,0)/n,r=$(g+"r");r.style.display="block";r.innerHTML=g=="ad"?'<div class="d">Tu resultado</div><p style="font-size:18px">Habilidad a fortalecer: '+SK[o.indexOf(Math.min(...o))]+' · Promedio: '+a.toFixed(1)+' de 4</p>':'<div class="d">Tu autoevaluación</div><p style="font-size:18px">Promedio: '+a.toFixed(1)+' de 4. '+(a>=3.5?"¡Nivel sobresaliente!":a>=2.5?"Vas bien: elige un criterio para mejorar esta semana.":"Hay mucho por ganar: empieza por un solo criterio.")+'</p>'}}
const VAL=[["Excelencia","Dar lo mejor de ti en cada intento, sin importar el marcador.","llegar a tiempo, repetir el gesto técnico y pedir corrección sin excusas.","rendir al máximo y medir el éxito por tu mejora personal, no solo por la medalla."],["Respeto","Tratar con dignidad a rivales, jueces, compañeros y a ti mismo, cumpliendo las reglas.","cuidar el material, escuchar al entrenador y turnarse sin atropellar.","aceptar el fallo arbitral, saludar al rival y no burlarse del que pierde."],["Amistad","Entender el deporte como un puente que une personas, incluso rivales.","apoyar al compañero que le cuesta y celebrar su progreso.","ayudar a un contrincante caído y compartir un gesto amable al final."]];
function vc(k){const v=VAL[k];$("vp").innerHTML='<h3 style="margin-top:10px">'+v[0]+'</h3><p>'+v[1]+'</p><p><b>En entrenamiento:</b> '+v[2]+'</p><p><b>En competencia:</b> '+v[3]+'</p>'}
const VN=["Excelencia","Respeto","Amistad"];
const MT=[["Repetir un gesto técnico hasta dominarlo",0],["Revisar tus errores en video para mejorar",0],["Aceptar la decisión del árbitro sin protestar",1],["Cumplir las reglas aunque nadie te vigile",1],["Ayudar a un rival lesionado",2],["Celebrar con el equipo contrario al terminar",2]];
let sel=-1,done=new Set();
function mrender(){$("pool").innerHTML=MT.map((m,i)=>done.has(i)?'':'<span class="chip'+(sel==i?' on':'')+'" draggable="true" ondragstart="sel='+i+'" onclick="sel='+i+';mrender()">'+m[0]+'</span>').join("")||'<b>¡Todo relacionado! 🎉</b>';VN.forEach((n,v)=>$("bx"+v).innerHTML='<h4 class="d" style="margin:0;color:var(--red)">'+n+'</h4>'+MT.map((m,i)=>done.has(i)&&m[1]==v?'<span class="chip ok">'+m[0]+'</span>':'').join(""))}
function drop(v){if(sel<0)return;if(MT[sel][1]==v){done.add(sel);$("mf").textContent="¡Correcto!";snd("ok")}else{$("mf").textContent="Esa situación no corresponde a ese valor. Inténtalo de nuevo.";snd("bad")}sel=-1;mrender()}
const MP=[["Persona","Autoconocimiento, disciplina y cuidado de tu cuerpo y tu mente."],["Aula","Participación justa, respeto por el ritmo de cada estudiante y juego sin exclusión."],["Sociedad","Convivencia, equidad y el deporte como herramienta de paz y de salud."],["Cultura","Respeto por tradiciones, juegos autóctonos y diversidad entre pueblos."],["Naturaleza","Cuidar los espacios de práctica y valorar el deporte al aire libre."]];
function mapH(){let s='<svg viewBox="0 0 300 300" style="max-width:340px;width:100%;display:block;margin:auto"><circle cx="150" cy="150" r="42" fill="#e50914"/><text x="150" y="154" text-anchor="middle" fill="#fff" font-family="Anton,Impact" font-size="14">VALORES</text>';MP.forEach((m,k)=>{const a=(-90+72*k)*Math.PI/180,x=150+105*Math.cos(a),y=150+105*Math.sin(a);s+='<line x1="150" y1="150" x2="'+x+'" y2="'+y+'" stroke="#e50914" stroke-width="2"/><g style="cursor:pointer" onclick="mp('+k+')"><circle cx="'+x+'" cy="'+y+'" r="33" fill="#242424" stroke="#e50914" stroke-width="3"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" fill="#ececec" font-size="11" font-family="Anton,Impact">'+m[0].toUpperCase()+'</text></g>'});return s+'</svg><div class="q" style="margin-top:12px"><div class="d">Toca un nodo del mapa</div><p id="mpx" style="font-size:18px">¿Dónde se aplican los valores?</p></div>'}
function mp(k){$("mpx").textContent=MP[k][0]+": "+MP[k][1]}
const QZ=[["¿Qué valor se refleja al ayudar a un rival lesionado?",["Excelencia","Amistad","Velocidad"],1],["Explicar una corrección sin humillar usa principalmente…",["Comunicación","Fuerza","Suerte"],0],["Ante la presión por resultados, lo más coherente con el olimpismo es…",["Ganar a cualquier costo","Buscar resultados sin sacrificar la formación ni el respeto","Evitar competir"],1],["El mapa multidimensional muestra valores en…",["Solo la cancha","Persona, aula, sociedad, cultura y naturaleza","Solo la competencia"],1],["Una sesión de entrenamiento con valores necesita…",["Solo ejercicios físicos","Un objetivo ético claro y una forma de evidenciarlo","Ninguna planeación"],1]];
let qs=0,qn=0;
function quiz(){qs=qn=0;return QZ.map((q,i)=>'<div class="sc"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<button class="opt" data-q="'+i+'" onclick="qa('+i+','+j+')">'+o+'</button>').join("")+'</div>').join("")+'<div class="q" style="margin-top:12px"><div class="d">Resultado del quiz</div><p id="qr" style="font-size:18px">Responde las 5 preguntas</p></div>'}
function qa(i,j){document.querySelectorAll('[data-q="'+i+'"]').forEach((b,k)=>{b.disabled=true;b.className="opt "+(k==QZ[i][2]?"good":"bad")});qn++;if(j==QZ[i][2]){qs++;snd("ok")}else snd("bad");if(qn==QZ.length)$("qr").textContent=qs+" de "+qn+(qs==qn?" · Medalla de oro 🥇":qs>=3?" · Medalla de plata 🥈":" · Medalla de bronce 🥉: repasa y reintenta")}
const ADI=["Cuando el grupo duda, yo doy el primer paso.","Explico mis ideas con claridad y escucho antes de responder.","Prefiero compartir el mérito antes que quedármelo.","Reconozco lo que siento antes de reaccionar.","Ante un imprevisto busco alternativas en vez de culpar."];
const M=[
{t:"Introducción y sentido formativo",f:"Antes de ser profesional, decide quién quieres ser.",q:"¿Qué tipo de profesional del deporte quiero ser?",p:"Descubrir para qué sirve formarse en valores y habilidades blandas, y fijar tu punto de partida como futuro profesional.",e:"Cierra los ojos y recuerda el momento en que un deporte te hizo sentir parte de algo más grande. Ese recuerdo es tu primer punto de partida.",c:"<b>Espíritu olímpico:</b> competir con ganas pero con honor, entendiendo el deporte como escuela de vida. <b>Relación con la vida profesional:</b> quien entrena, enseña o gestiona deporte forma personas; su ejemplo pesa tanto como su técnica.",i:()=>'<p>Mira el video motivacional del espíritu olímpico y responde la pregunta detonante:</p><p>'+vb(0,"Video 1: espíritu olímpico")+'</p>'+ta("m1","Quiero ser un profesional que…"),v:"Evidencia: tu respuesta a la pregunta detonante, con al menos dos razones."},
{t:"Valores olímpicos",f:"Los valores no se recitan: se practican.",q:"¿Cuál de estos valores me cuesta más practicar cuando nadie me ve?",p:"Definir excelencia, respeto y amistad y reconocerlos en situaciones deportivas concretas.",e:"Mira el segundo video y anota qué gesto de un deportista te pareció más honorable.<br><br>"+vb(1,"Video 2: valores olímpicos"),c:"Los tres valores son la base ética del movimiento olímpico. Se contextualizan en el deporte en cada sesión, en el vestuario, en la tribuna y en el trato con rivales y jueces. Abre cada tarjeta para ver ejemplos de entrenamiento y de competencia.",i:()=>'<p>Tarjetas clicables:</p>'+VAL.map((v,k)=>'<button class="btn g" style="margin:4px" onclick="vc('+k+')">'+v[0]+'</button>').join("")+'<div id="vp"></div>',v:"Explica con tus palabras cada valor y da un ejemplo de entrenamiento y otro de competencia."},
{t:"Habilidades blandas en el deporte",f:"El talento abre la puerta; el carácter te mantiene adentro.",q:"¿Qué habilidad humana me distingue como profesional, además de mi técnica?",p:"Reconocer cinco habilidades blandas clave y diagnosticar tu nivel actual.",e:"Piensa en el mejor equipo en el que estuviste: ¿qué hacían bien las personas más allá de lo técnico?",c:"<b>Liderazgo:</b> inspirar con el ejemplo. <b>Comunicación:</b> mensajes claros y escucha activa. <b>Trabajo en equipo:</b> metas y roles compartidos. <b>Inteligencia emocional:</b> reconocer y regular emociones. <b>Resolución de problemas:</b> hallar salidas bajo presión.",i:()=>'<b>Autodiagnóstico</b>'+rates("ad",ADI)+'<br><b>Escenarios cortos</b>'+scen("e1","Escenario 1","Un compañero se frustra y lanza el balón al piso tras fallar.",[["Le grito que se calme.",0,"Aumentas la tensión."],["Espero unos segundos, me acerco y le digo: “Respira, la siguiente la resolvemos juntos”.",1,"Inteligencia emocional y comunicación empática."],["Lo ignoro.",0,"Dejas solo a tu compañero."]])+scen("e2","Escenario 2","El plan táctico falla en el minuto 20 y el equipo se desordena.",[["Culpo al grupo por los errores.",0,"Culpar no soluciona nada."],["Propongo dos ajustes rápidos, los comunico claro y verifico que todos entendieron.",1,"Resolución de problemas, liderazgo y comunicación."],["Sigo con el plan: ya cambiará la suerte.",0,"Insistir sin analizar no es resolver."]]),v:"Resultado del autodiagnóstico y decisiones razonadas en los dos escenarios."},
